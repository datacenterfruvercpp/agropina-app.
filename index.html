<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AgroPiña Enterprise · ERP agrícola para fincas de piña</title>
  <meta name="description" content="ERP agrícola para fincas de piña: multi-finca, órdenes de trabajo, planilla, compras, inventario con kardex, ventas y cuentas por cobrar, presupuesto vs real, clima, sanidad y reportes. Funciona sin conexión.">
  <meta name="theme-color" content="#0f1b2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="apple-touch-icon" href="assets/icon.svg">

  <!-- Tema y densidad antes del primer pintado (evita parpadeo) -->
  <script>
    try {
      var d3 = JSON.parse(localStorage.getItem('agropina_v3') || 'null');
      var pr = (d3 && d3.prefs) || {};
      var t = pr.tema || ((JSON.parse(localStorage.getItem('agropina_v2') || '{}').settings || {}).tema) || 'system';
      if (t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      if (pr.densidad === 'compacta') document.documentElement.classList.add('compact');
    } catch (e) {}
  </script>

  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/tailwind.css">

</head>
