<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AgroPiña Pro · Gestión inteligente de piña</title>
  <meta name="description" content="Plataforma de gestión para fincas de piña: fenología, proyección de cosechas, clima y ventanas de aplicación, inventario, sanidad y rentabilidad. Funciona sin conexión.">
  <meta name="theme-color" content="#05603a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AgroPiña Pro">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon.svg">

  <!-- Tema antes del primer pintado (evita parpadeo) -->
  <script>
    try {
      var s = (JSON.parse(localStorage.getItem('agropina_v2') || '{}').settings) || {};
      var t = s.tema || (localStorage.getItem('agropina_theme') === 'dark' ? 'dark' : 'system');
      if (t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
    } catch (e) {}
  </script>

  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <div class="ap-splash"><div><img src="assets/icon.svg" alt="AgroPiña Pro"><p>AgroPiña Pro</p></div></div>
  </div>
  <noscript><p style="padding:24px;font-family:sans-serif">AgroPiña Pro necesita JavaScript habilitado.</p></noscript>

  <!-- Librerías locales (sin CDN: funcionan sin conexión) -->
  <script src="vendor/vue.global.prod.js"></script>
  <script src="vendor/chart.umd.min.js"></script>
  <script src="vendor/leaflet/leaflet.js"></script>

  <!-- Núcleo -->
  <script src="js/utils.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/agronomy.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/store.js"></script>
  <script src="js/demo.js"></script>

  <!-- Interfaz -->
  <script src="js/ui.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/parcelas.js"></script>
  <script src="js/views/labores.js"></script>
  <script src="js/views/clima.js"></script>
  <script src="js/views/mapa.js"></script>
  <script src="js/views/produccion.js"></script>
  <script src="js/views/finanzas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
